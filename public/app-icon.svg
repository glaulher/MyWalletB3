<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Neon Rim Border Gradient -->
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Gold Trims -->
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Wallet Body Gradient -->
    <linearGradient id="walletBody" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="40%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="walletFlap" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="70%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Chart / Arrow Glow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Bar Chart Gradient -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Filters for subtle glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleNeon" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle with Neon Border -->
  <rect x="24" y="24" width="464" height="464" rx="105" ry="105" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="105" ry="105" fill="none" stroke="url(#neonRim)" stroke-width="8" stroke-opacity="0.85" filter="url(#subtleNeon)" />

  <!-- Inner Subtle Glow Field -->
  <circle cx="256" cy="256" r="160" fill="#06b6d4" opacity="0.08" filter="url(#glow)" />

  <!-- Back of Wallet / Cards Pocket Layer -->
  <g transform="translate(0, 8)">
    <rect x="120" y="156" width="260" height="70" rx="22" fill="#032b21" stroke="url(#goldTrim)" stroke-width="4.5" />
    <!-- Golden B3 Ingot / Credit Card Top -->
    <rect x="145" y="140" width="130" height="34" rx="8" fill="url(#goldTrim)" opacity="0.95" />
    <rect x="165" y="148" width="40" height="5" rx="2.5" fill="#78350f" opacity="0.6" />
  </g>

  <!-- Main Wallet Body -->
  <g id="wallet">
    <!-- Wallet Outer Gold Rim / Shadow -->
    <rect x="110" y="186" width="270" height="200" rx="30" fill="url(#goldTrim)" />
    <!-- Wallet Main Leather Pocket -->
    <rect x="116" y="192" width="258" height="188" rx="25" fill="url(#walletBody)" />

    <!-- Inner Pattern / Subtle Grid -->
    <path d="M 120 230 L 370 230 M 120 280 L 370 280 M 120 330 L 370 330" stroke="#064e3b" stroke-width="1.5" opacity="0.4" />

    <!-- Vertical Stock Growth Bars inside Wallet -->
    <rect x="156" y="282" width="22" height="72" rx="11" fill="url(#barGrad1)" />
    <rect x="194" y="248" width="22" height="106" rx="11" fill="url(#barGrad2)" />
    <rect x="232" y="214" width="22" height="140" rx="11" fill="url(#barGrad3)" />

    <!-- Wallet Clasp / Strap -->
    <path d="M 330 256 L 396 256 C 414 256 428 270 428 288 C 428 306 414 320 396 320 L 330 320 Z" fill="url(#goldTrim)" />
    <path d="M 330 261 L 394 261 C 409 261 422 273 422 288 C 422 303 409 315 394 315 L 330 315 Z" fill="url(#walletFlap)" />
    <!-- Clasp Button (Gold Coin) -->
    <circle cx="392" cy="288" r="14" fill="url(#goldTrim)" />
    <circle cx="392" cy="288" r="10" fill="#fef08a" opacity="0.6" />
    <circle cx="390" cy="286" r="3" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Glowing Ascending Chart & Arrow (Forefront) -->
  <g id="growth-arrow" filter="url(#subtleNeon)">
    <!-- Glow Path Underneath -->
    <polyline points="132,324 210,240 262,284 374,136"
              fill="none"
              stroke="#06b6d4"
              stroke-width="26"
              stroke-linecap="round"
              stroke-linejoin="round"
              opacity="0.3" />

    <!-- Main Dynamic Arrow Stroke -->
    <polyline points="132,324 210,240 262,284 374,136"
              fill="none"
              stroke="url(#arrowGrad)"
              stroke-width="15"
              stroke-linecap="round"
              stroke-linejoin="round" />

    <!-- Arrow Head -->
    <path d="M 330 134 L 388 122 L 376 180 Z"
          fill="url(#arrowGrad)"
          stroke="#34d399"
          stroke-width="3"
          stroke-linejoin="round" />

    <!-- Chart Joint Nodes -->
    <circle cx="132" cy="324" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
    <circle cx="210" cy="240" r="8" fill="#2dd4bf" stroke="#ffffff" stroke-width="3" />
    <circle cx="262" cy="284" r="8" fill="#34d399" stroke="#ffffff" stroke-width="3" />
  </g>
</svg>
